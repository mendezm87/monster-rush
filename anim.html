<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monster Rush Animations</title>
  <link rel="stylesheet" href="css/fonts.css">
  <style>
    body { margin: 0; background: #1c2e1a; color: #fff; font-family: 'Lilita One', 'Arial Black', Arial, sans-serif; }
    header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    h1 { font-size: 22px; margin: 0 12px 0 0; color: #ffe066; }
    select, button { font: inherit; font-size: 15px; padding: 6px 10px; border-radius: 8px; border: 2px solid #15111f; background: #3a3358; color: #fff; cursor: pointer; }
    button.on { background: #e0a83a; color: #15111f; }
    .note { font: 600 14px system-ui, sans-serif; opacity: .8; padding: 0 16px 8px; }
    canvas { display: block; margin: 0 auto; max-width: 100%; image-rendering: pixelated; }
  </style>
</head>
<body>
  <header>
    <h1>Animations</h1>
    <select id="mon"></select>
    <span id="anims"></span>
  </header>
  <div class="note" id="note"></div>
  <canvas id="c" width="1000" height="230"></canvas>

  <script src="js/data.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/sprites.js"></script>
  <script>
    // Plays a monster's animations at real speed in all five views, with the game's own
    // frame picking (monAnim in sprites.js). Rigged monsters have real frames; the rest hop.
    buildSprites();
    const ANIMS = ['idle', 'walk', 'attack', 'hurt'];
    const SHOW_VIEWS = ['front', 'fside', 'side', 'bside', 'back'];
    const sel = document.getElementById('mon');
    for (const m of ALL_MONS()) sel.add(new Option(m.name + (RIGGED.has(m.id) ? '  (rigged)' : ''), m.id));
    sel.value = 'smugshi';
    let anim = 'walk';
    const box = document.getElementById('anims');
    for (const a of ANIMS) {
      const b = document.createElement('button'); b.textContent = a[0].toUpperCase() + a.slice(1);
      b.onclick = () => { anim = a; [...box.children].forEach(x => x.classList.toggle('on', x === b)); };
      if (a === anim) b.classList.add('on');
      box.appendChild(b);
    }
    const note = () => document.getElementById('note').textContent = RIGGED.has(sel.value)
      ? 'Rigged: its legs, head, tail and face move as separate parts.'
      : 'Not rigged yet: it only hops when walking and dips when attacking.';
    sel.onchange = note; note();

    const c = document.getElementById('c'), x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    const mons = SHOW_VIEWS.map((view, i) => ({ view, walkT: 0, fadeT: 0, phase: i * 0.7 }));
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      x.fillStyle = '#3f7a3a'; x.fillRect(0, 0, c.width, c.height);
      const sp = SPRITES[sel.value], scale = 5 * 32 / sp.size;
      mons.forEach((m, i) => {
        m.id = sel.value; m.fainted = false;
        m.action = null; m.hurtT = 0; m.popT = 0;
        const t = now / 1000 + m.phase;
        if (anim === 'walk') m.walkT += 110 * dt;
        if (anim === 'attack') { const k = t % 1.2; m.action = { kind: 'cast', t: k, dur: 0.6 }; }
        if (anim === 'hurt') m.hurtT = (t % 1) < 0.35 ? 0.2 : 0;
        const look = monAnim(m, m.phase, false);
        const pic = posed(look.views[m.view], look.sq, look.sh);
        const w = pic.width * scale, h = pic.height * scale;
        const cx = 100 + i * 200, ground = 210;
        x.fillStyle = 'rgba(0,0,0,0.3)'; x.beginPath(); x.ellipse(cx, ground, 40, 10, 0, 0, Math.PI * 2); x.fill();
        x.drawImage(pic, Math.round(cx - w / 2), Math.round(ground - h - look.dy * scale / 1.5 + 6), w, h);
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
